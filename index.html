<body>
  <div id="app"><div class="loading">Đang tải nội dung cửa hàng…</div></div>
  <!-- Netlify nhận diện form tĩnh này khi deploy; form đang hiển thị được dựng từ dữ liệu CMS. -->
  <form name="tu-van" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="tu-van" />
    <input name="ho-ten" /><input name="so-dien-thoai" /><input name="nhu-cau" /><input name="model" /><textarea name="ghi-chu"></textarea><input name="bot-field" />
  </form>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const CONTENT_FILES = {
      home: 'content/home.md', products: 'content/products.md', services: 'content/services.md',
      trust: 'content/trust.md', feedback: 'content/feedback.md', contact: 'content/contact.md'
    };
    const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const safeUrl = value => {
      const url = String(value || '').trim();
      if (/^(https?:|tel:|mailto:|#|\/)/i.test(url)) return url;
      return '#';
    };
    const money = value => {
      const number = Number(value);
      return Number.isFinite(number) && number > 0 ? new Intl.NumberFormat('vi-VN').format(number) + 'đ' : '';
    };
    const renderStars = value => {
      const rating = Math.min(5, Math.max(1, Number(value) || 5));
      return '★'.repeat(rating) + '☆'.repeat(5 - rating);
    };
    const icon = (name, extra = '') => {
      const paths = {
        check: '<path d="m5 12 4 4L19 6"/>',
        shield: '<path d="M12 3 5 6v5c0 4.5 2.8 7.7 7 10 4.2-2.3 7-5.5 7-10V6l-7-3Z"/><path d="m9 12 2 2 4-4"/>',
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        receipt: '<path d="M4 4h16v16l-4-2-4 2-4-2-4 2V4Z"/><path d="M8 9h8M8 13h5"/>',
        phone: '<path d="M22 16.9v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 11.2 19a19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7l.5 3a2 2 0 0 1-.6 1.7l-1.3 1.3a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 1.7-.6l3 .5a2 2 0 0 1 1.3 2.6Z"/>',
        pin: '<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>',
        tool: '<path d="m14.5 6.5 3 3M4 20l5.2-1 9.9-9.9a2.1 2.1 0 0 0-3-3L6.2 16 4 20Z"/><path d="M13 4a5 5 0 0 0 6 6"/>',
        star: '<path d="m12 3 2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.6-5 2.6.9-5.6-4-3.9 5.6-.8L12 3Z"/>',
        bubble: '<path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H6l-3 2 1-4.3A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11h.01M12 11h.01M16 11h.01" stroke-width="3" stroke-linecap="round"/>',
        menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
        arrow: '<path d="M5 12h14m-6-6 6 6-6 6"/>',
        bag: '<path d="M5 8h14l-1 13H6L5 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>'
      };
      return `<svg class="${extra}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[name] || paths.check}</svg>`;
    };
    function robotArt() {
      return `<svg class="hero-robot" viewBox="0 0 440 400" role="img" aria-label="Robot kỹ thuật đang sửa điện thoại">
        <defs><linearGradient id="robotShell" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f0fbff"/><stop offset=".52" stop-color="#9cb9c6"/><stop offset="1" stop-color="#59788c"/></linearGradient><linearGradient id="robotBody" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#d7e7ec"/><stop offset="1" stop-color="#728fa1"/></linearGradient><linearGradient id="robotTool" x1="0" x2="1"><stop stop-color="#c8f36a"/><stop offset="1" stop-color="#4bd8e7"/></linearGradient><filter id="robotGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <ellipse cx="221" cy="356" rx="151" ry="17" fill="#020b14" opacity=".34"/><path d="M67 315h305l-16 18H83z" fill="#d9e9ee"/><path d="M84 333h267v12H84z" fill="#7895a5"/><path d="M112 345h14v24h-14zm197 0h14v24h-14z" fill="#526f83"/>
        <rect x="179" y="286" width="104" height="24" rx="6" fill="#071726" stroke="#9bb6c3" stroke-width="2" transform="rotate(-5 179 286)"/><rect x="188" y="291" width="82" height="13" rx="3" fill="#31bed0" opacity=".76" transform="rotate(-5 188 291)"/><path d="M218 295h37" stroke="#e7ffff" stroke-width="2" stroke-linecap="round" opacity=".85" transform="rotate(-5 218 295)"/><circle cx="264" cy="298" r="2" fill="#c8f36a"/>
        <path d="M207 52V34" stroke="#9fc2cd" stroke-width="7" stroke-linecap="round"/><circle cx="207" cy="28" r="10" fill="#c8f36a" stroke="#f4ffcf" stroke-width="3" filter="url(#robotGlow)"/><path d="M128 109c-13-5-20 3-20 17v24c0 12 8 19 20 16m159-57c13-5 20 3 20 17v24c0 12-8 19-20 16" fill="#7998a9" stroke="#d7e9ef" stroke-width="4"/><rect x="130" y="57" width="156" height="125" rx="37" fill="url(#robotShell)" stroke="#effaff" stroke-width="4"/><rect x="148" y="75" width="120" height="88" rx="25" fill="#071b2c" stroke="#35536a" stroke-width="3"/><circle cx="184" cy="112" r="11" fill="#4bd8e7" filter="url(#robotGlow)"/><circle cx="232" cy="112" r="11" fill="#4bd8e7" filter="url(#robotGlow)"/><path d="M187 139q21 18 42 0" fill="none" stroke="#c8f36a" stroke-width="5" stroke-linecap="round"/>
        <path d="M174 180v18m67-18v18" stroke="#607f91" stroke-width="17" stroke-linecap="round"/><path d="M154 196q-8-10-20-6l-37 13q-13 5-8 18 4 12 18 8l42-12" fill="url(#robotBody)" stroke="#effaff" stroke-width="3"/><circle cx="97" cy="214" r="12" fill="#4bd8e7" stroke="#d9fbff" stroke-width="3"/><path d="M95 216 145 260" stroke="#9cb9c6" stroke-width="21" stroke-linecap="round"/><circle cx="145" cy="260" r="12" fill="#1c667e" stroke="#9cebf0" stroke-width="3"/><path d="M145 260 169 282" stroke="#d8e8ed" stroke-width="17" stroke-linecap="round"/><path d="m164 277 12 9-6 11-13-11z" fill="#9cb9c6" stroke="#effaff" stroke-width="2"/>
        <path d="M282 202q12-10 23 0l29 27q10 10 1 20-9 9-19 0l-33-25" fill="url(#robotBody)" stroke="#effaff" stroke-width="3"/><circle cx="333" cy="241" r="12" fill="#c8f36a" stroke="#f4ffcf" stroke-width="3"/><path d="M333 241 308 274" stroke="#9cb9c6" stroke-width="19" stroke-linecap="round"/><circle cx="308" cy="274" r="11" fill="#1c667e" stroke="#9cebf0" stroke-width="3"/><path d="m302 280 13 9m-16-5 9 13m9-17 9 9" stroke="#d7e9ef" stroke-width="5" stroke-linecap="round"/>
        <path d="M164 191q58-25 116 0l13 103H151z" fill="url(#robotBody)" stroke="#effaff" stroke-width="4"/><rect x="183" y="213" width="78" height="52" rx="16" fill="#12324a" stroke="#7ce4e7" stroke-width="2"/><path d="M199 231h46m-38 13h30" stroke="#4bd8e7" stroke-width="4" stroke-linecap="round"/><circle cx="223" cy="254" r="3" fill="#c8f36a"/><path d="m169 284 37 17" stroke="url(#robotTool)" stroke-width="9" stroke-linecap="round"/><path d="m205 301 11 5-11-1" fill="#d7e9ef" stroke="#d7e9ef" stroke-width="2" stroke-linejoin="round"/><path d="m182 269 4-8m8 12 7-6m-26 2-6-7" stroke="#c8f36a" stroke-width="3" stroke-linecap="round"/>
      </svg>`;
    }
    async function readMarkdown(path) {
      const response = await fetch(`${path}?v=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`Không đọc được ${path} (${response.status})`);
      const raw = await response.text();
      const match = raw.match(/^---\s*\r?\n([\s\S]*?)\r?\n---(?:\r?\n|$)/);
      if (!match) throw new Error(`File ${path} thiếu YAML front matter`);
      return window.jsyaml.load(match[1]) || {};
    }
    function renderProduct(item) {
      const price = money(item.price);
      const oldPrice = money(item.old_price);
      const art = item.image
        ? `<img src="${esc(item.image)}" alt="${esc(item.image_alt || item.title)}" loading="lazy">`
        : `<div class="phone-art"><div class="phone-screen-art"></div></div><div class="phone-art"><div class="phone-screen-art"></div></div>`;
      return `<article class="product-card"><div class="product-art">${art}<span class="product-tag">${esc(item.condition || 'Đã kiểm tra')}</span></div><div class="product-body"><div class="product-meta"><span>${esc(item.brand || 'Điện thoại')}</span><span>${esc(item.storage || '')}</span></div><h3>${esc(item.title)}</h3><p class="product-desc">${esc(item.description || '')}</p><div class="price-row"><span class="price">${price ? `Từ ${price}` : esc(item.price_label || 'Liên hệ báo giá')}</span>${oldPrice ? `<span class="old-price">${oldPrice}</span>` : ''}</div>${item.gift ? `<div class="gift-line">${icon('bag')}<span>${esc(item.gift)}</span></div>` : ''}<a class="btn btn-dark product-action" href="#dat-lich" data-product="${esc(item.title)}">${esc(item.button_label || 'Hỏi tình trạng & giá')} ${icon('arrow')}</a></div></article>`;
    }
    function renderServiceGroup(group, style = '') {
      const rows = (group.items || []).map(item => `<li>${icon('check')}<span>${esc(item.name)}${item.description ? `<small class="service-item-note">${esc(item.description)}</small>` : ''}</span></li>`).join('');
      const prices = (group.items || []).map(item => {
        const value = money(item.price_from);
        return `<div class="service-price"><span>${esc(item.name)}</span><strong>${value ? `Từ ${value}` : esc(item.price_label || 'Liên hệ')}</strong></div>`;
      }).join('');
      return `<article class="service-card"><div class="service-top"><span class="service-icon ${style}">${icon(group.icon || 'tool')}</span><span><h3>${esc(group.title)}</h3><p class="service-sub">${esc(group.description || '')}</p></span></div><ul class="service-list">${rows}</ul><div class="service-prices">${prices}</div><p class="service-price-note">${esc(group.price_note || '')}</p><p class="service-note"><strong>${esc(group.note_label || 'Quy trình:')}</strong> ${esc(group.note || '')}</p></article>`;
    }
    function renderRobotOrImage(home) {
      const image = home.hero?.image;
      if (!image) return robotArt();
      return `<img class="hero-robot hero-photo" src="${esc(image)}" alt="${esc(home.hero.image_alt || 'Kỹ thuật viên sửa điện thoại tại cửa hàng')}" />`;
    }
    function renderSite(data) {
      const h = data.home, products = data.products.products || [], services = data.services, trust = data.trust, feedback = data.feedback, contact = data.contact;
      document.title = `${h.store_name} | ${h.page_title}`;
      const metaDescription = document.querySelector('meta[name="description"]');
      if (metaDescription && h.page_description) metaDescription.content = h.page_description;
      const nav = (h.navigation || []).map(item => `<a href="${safeUrl(item.url)}">${esc(item.label)}</a>`).join('');
      const stats = (h.stats || []).map(item => `<div class="stat"><span class="stat-icon">${icon(item.icon || 'check')}</span><span><strong>${esc(item.title)}</strong><small>${esc(item.description)}</small></span></div>`).join('');
      const commitments = (trust.items || []).map(item => `<article class="trust-item"><span class="trust-icon">${icon(item.icon || 'shield')}</span><h3>${esc(item.title)}</h3><p>${esc(item.description)}</p></article>`).join('');
      const reviews = (feedback.testimonials || []).map(item => `<article class="feedback-card"><div class="stars" aria-label="${esc(item.rating || 5)} trên 5 sao">${renderStars(item.rating)}</div><blockquote>“${esc(item.quote)}”</blockquote><div class="feedback-person">${item.image ? `<img src="${esc(item.image)}" alt="${esc(item.name)}" loading="lazy">` : `<span class="avatar-fallback">${esc((item.name || 'K').trim().slice(0,1))}</span>`}<span><strong>${esc(item.name)}</strong><small>${esc(item.context || '')}</small></span></div></article>`).join('');
      const gallery = (feedback.gallery || []).map(item => `<figure class="gallery-card"><img src="${esc(item.image)}" alt="${esc(item.alt || item.caption)}" loading="lazy"><figcaption class="gallery-caption">${esc(item.caption)}</figcaption></figure>`).join('');
      const feedbackContent = reviews || `<p class="empty-note">${esc(feedback.empty_message || 'Đánh giá khách hàng sẽ hiển thị tại đây sau khi được thêm trong trang Admin.')}</p>`;
      const galleryContent = gallery || `<p class="empty-note">${esc(feedback.gallery_empty_message || 'Thêm ảnh khách hàng hoặc kỹ thuật viên tại mục Feedback trong Admin.')}</p>`;
      const mapHref = safeUrl(contact.map_url || `https://maps.google.com/?q=${encodeURIComponent(contact.address || '')}`);
      const mapSrc = `${mapHref}${mapHref.includes('?') ? '&' : '?'}output=embed`;
      const phoneDigits = String(contact.phone || '').replace(/[^+\d]/g, '');
      const zaloHref = safeUrl(contact.zalo_url || `https://zalo.me/${phoneDigits.replace(/\D/g,'')}`);
      const messengerHref = safeUrl(contact.messenger_url || '#');
      document.getElementById('app').innerHTML = `
        <div class="topbar"><div class="container topbar-inner"><div class="topbar-note">${esc(h.top_notice)}</div><a href="tel:${esc(phoneDigits)}">${esc(contact.hotline_label)}: ${esc(contact.phone)}</a></div></div>
        <header class="header"><div class="container nav"><a class="brand" href="#trang-chu" aria-label="${esc(h.store_name)}"><span class="brand-mark">${esc(h.logo_mark || 'NQ')}</span><span><span class="brand-name">${esc(h.store_name)}</span><span class="brand-sub">${esc(h.brand_subtitle)}</span></span></a><nav class="nav-links" id="main-nav" aria-label="${esc(h.nav_aria || 'Điều hướng chính')}">${nav}</nav><a class="nav-cta" href="${safeUrl(h.header_cta_url)}">${esc(h.header_cta_label)} ↗</a><button class="menu-toggle" id="menu-toggle" type="button" aria-label="Mở menu" aria-expanded="false" aria-controls="main-nav">${icon('menu')}</button></div></header>
        <main>
          <section class="hero" id="trang-chu"><div class="container hero-grid"><div><div class="hero-chip">${esc(h.hero.eyebrow)}</div><h1>${esc(h.hero.heading)}<br><em>${esc(h.hero.highlight)}</em></h1><p class="hero-copy">${esc(h.hero.description)}</p><div class="hero-actions"><a class="btn btn-primary" href="${safeUrl(h.hero.primary_url)}">${esc(h.hero.primary_label)} ${icon('arrow')}</a><a class="btn btn-outline" href="${safeUrl(h.hero.secondary_url)}">${icon('tool')} ${esc(h.hero.secondary_label)}</a></div><div class="hero-points">${(h.hero.points || []).map(point => `<span>${icon('check')}${esc(point)}</span>`).join('')}</div></div><div class="hero-visual"><div class="hero-orbit"></div><div class="hero-glow"></div>${renderRobotOrImage(h)}<div class="hero-float one"><span class="float-icon">${icon('star')}</span><span><strong>${esc(h.hero.float_one_title)}</strong><small>${esc(h.hero.float_one_text)}</small></span></div><div class="hero-float two"><span class="float-icon lime">${icon('tool')}</span><span><strong>${esc(h.hero.float_two_title)}</strong><small>${esc(h.hero.float_two_text)}</small></span></div></div></div></section>
          <section class="quick-stats" aria-label="${esc(h.stats_aria)}"><div class="container stats-grid">${stats}</div></section>
          <section class="section products" id="dien-thoai"><div class="container"><div class="section-head"><div><p class="section-kicker">${esc(h.products_heading.eyebrow)}</p><h2 class="section-title">${esc(h.products_heading.title)}</h2><p class="section-copy">${esc(h.products_heading.description)}</p></div><a class="text-link" href="#dat-lich">${esc(h.products_heading.link_label)} ${icon('arrow')}</a></div><div class="product-grid">${products.map(renderProduct).join('')}</div><p class="service-price-note">${esc(h.products_heading.note)}</p></div></section>
          <section class="section services" id="sua-chua"><div class="container"><p class="section-kicker">${esc(h.services_heading.eyebrow)}</p><h2 class="section-title">${esc(h.services_heading.title)}</h2><p class="section-copy">${esc(h.services_heading.description)}</p><div class="service-grid">${renderServiceGroup(services.hardware, '')}${renderServiceGroup(services.software, 'cyan')}</div></div></section>
          <section class="section trust" id="cam-ket"><div class="container"><p class="section-kicker">${esc(trust.eyebrow)}</p><h2 class="section-title">${esc(trust.title)}</h2><p class="section-copy">${esc(trust.description)}</p><div class="trust-grid">${commitments}</div></div></section>
          <section class="section proof" id="feedback"><div class="container"><p class="section-kicker">${esc(feedback.eyebrow)}</p><h2 class="section-title">${esc(feedback.title)}</h2><p class="section-copy">${esc(feedback.description)}</p><div class="feedback-grid">${feedbackContent}</div><div class="gallery-grid">${galleryContent}</div></div></section>
          <section class="section booking" id="dat-lich"><div class="container booking-grid"><div><p class="section-kicker">${esc(h.booking.eyebrow)}</p><h2 class="section-title">${esc(h.booking.title)}</h2><p class="section-copy">${esc(h.booking.description)}</p><div class="booking-benefits">${(h.booking.benefits || []).map(text => `<div class="booking-benefit"><span>${icon('check')}</span>${esc(text)}</div>`).join('')}</div></div><form class="form-card" name="tu-van" method="POST" data-netlify="true" netlify-honeypot="bot-field"><input type="hidden" name="form-name" value="tu-van"><p class="hidden"><label>Không điền ô này<input name="bot-field"></label></p><h3>${esc(h.booking.form_title)}</h3><p>${esc(h.booking.form_description)}</p><div class="form-grid"><div class="field full"><label for="need">${esc(h.booking.need_label)}</label><select id="need" name="nhu-cau" required>${(h.booking.needs || []).map(item => `<option value="${esc(item)}">${esc(item)}</option>`).join('')}</select></div><div class="field"><label for="customer-name">${esc(h.booking.name_label)}</label><input id="customer-name" name="ho-ten" type="text" placeholder="${esc(h.booking.name_placeholder)}" autocomplete="name" required></div><div class="field"><label for="customer-phone">${esc(h.booking.phone_label)}</label><input id="customer-phone" name="so-dien-thoai" type="tel" placeholder="${esc(h.booking.phone_placeholder)}" autocomplete="tel" inputmode="tel" required></div><div class="field full"><label for="customer-model">${esc(h.booking.model_label)}</label><input id="customer-model" name="model" type="text" placeholder="${esc(h.booking.model_placeholder)}"></div><div class="field full"><label for="customer-note">${esc(h.booking.note_label)}</label><textarea id="customer-note" name="ghi-chu" placeholder="${esc(h.booking.note_placeholder)}"></textarea></div></div><button class="btn btn-primary form-submit" type="submit">${esc(h.booking.submit_label)} ${icon('arrow')}</button><p class="form-privacy">${esc(h.booking.privacy_note)}</p></form></div></section>
          <section class="section contact" id="lien-he"><div class="container contact-grid"><div><p class="section-kicker">${esc(contact.eyebrow)}</p><h2 class="section-title">${esc(contact.title)}</h2><p class="section-copy">${esc(contact.description)}</p><div class="contact-list"><div class="contact-row"><span class="contact-icon">${icon('pin')}</span><span><strong>${esc(contact.address_label)}</strong>${esc(contact.address)}</span></div><div class="contact-row"><span class="contact-icon">${icon('phone')}</span><span><strong>${esc(contact.phone_label)}</strong><a href="tel:${esc(phoneDigits)}">${esc(contact.phone)}</a></span></div><div class="contact-row"><span class="contact-icon">${icon('clock')}</span><span><strong>${esc(contact.hours_label)}</strong>${esc(contact.opening_hours)}</span></div></div></div><div class="map-card">${contact.address ? `<iframe title="${esc(contact.map_title)}" src="${mapSrc}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>` : `<div class="map-empty">${esc(contact.map_empty_message)}</div>`}</div></div></section>
        </main>
        <footer class="footer"><div class="container footer-inner"><span>© ${new Date().getFullYear()} ${esc(h.store_name)} · ${esc(h.footer_note)}</span><a href="#trang-chu">${esc(h.back_to_top)} ↑</a></div></footer>
        <div class="floating-bar" role="group" aria-label="${esc(contact.quick_contact_aria)}"><span class="floating-label">${esc(contact.quick_contact_label)}</span><a class="float-btn" href="tel:${esc(phoneDigits)}" aria-label="${esc(contact.call_label)}" title="${esc(contact.call_label)}">${icon('phone')}</a><a class="float-btn zalo" href="${zaloHref}" target="_blank" rel="noopener noreferrer" aria-label="${esc(contact.zalo_label)}" title="${esc(contact.zalo_label)}">${icon('bubble')}</a><a class="float-btn messenger" href="${messengerHref}" target="_blank" rel="noopener noreferrer" aria-label="${esc(contact.messenger_label)}" title="${esc(contact.messenger_label)}">${icon('bubble')}</a></div>`;
      const needSelect = document.getElementById('need');
      needSelect.insertAdjacentHTML('afterbegin', `<option value="" disabled selected>${esc(h.booking.need_placeholder)}</option>`);
      const toggle = document.getElementById('menu-toggle');
      const menu = document.getElementById('main-nav');
      toggle.addEventListener('click', () => { const open = menu.classList.toggle('open'); toggle.setAttribute('aria-expanded', String(open)); toggle.setAttribute('aria-label', open ? 'Đóng menu' : 'Mở menu'); });
      menu.querySelectorAll('a').forEach(link => link.addEventListener('click', () => { menu.classList.remove('open'); toggle.setAttribute('aria-expanded', 'false'); }));
      document.querySelectorAll('[data-product]').forEach(link => link.addEventListener('click', () => { const model = document.getElementById('customer-model'); if (model) model.value = link.dataset.product; }));
    }
    async function start() {
      try {
        if (!window.jsyaml) throw new Error('Không tải được thư viện đọc Markdown. Hãy kiểm tra kết nối internet/CDN.');
        const entries = await Promise.all(Object.entries(CONTENT_FILES).map(async ([key,path]) => [key, await readMarkdown(path)]));
        renderSite(Object.fromEntries(entries));
      } catch (error) {
        document.getElementById('app').innerHTML = `<div class="error-state"><strong>Chưa tải được nội dung cửa hàng.</strong><br>${esc(error.message)}<br>Hãy tải trang qua máy chủ web và kiểm tra các file trong thư mục <code>content/</code>.</div>`;
        console.error(error);
      }
    }
    start();
    if (window.netlifyIdentity) window.netlifyIdentity.on('init', user => { if (!user) window.netlifyIdentity.on('login', () => { window.location.href = '/admin/'; }); });
  </script>
</body>
</html>
